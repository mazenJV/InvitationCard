    --serif:'Mirza','Amiri','Scheherazade New',serif;   /* default for every text container, now and later */
    --quran:'Scheherazade New','Amiri',serif;
    --sans:'Tajawal','Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
  body.sealed{overflow:hidden;height:100dvh}

  /* =============== SCREEN 1: sealed envelope, full screen =============== */
  .stage{position:relative;height:100dvh;min-height:480px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .stage.present{overflow:visible}            /* nothing clips the card's shadow once it is out */
  /* one continuous, fixed surface behind everything; the pages and their shadows travel over it */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.6s ease .6s;
    background:radial-gradient(ellipse at 50% 42%,rgba(255,252,246,.55),rgba(255,252,246,0) 62%)}
  body.opened::before{opacity:1}
  .stage,.pages{position:relative;z-index:1}
  .frame{position:relative;flex:none;width:min(88vw,50.6dvh);height:min(90dvh,156.4vw);overflow:visible;perspective:1500px;perspective-origin:50% 47%}

  .env{position:absolute;inset:0;z-index:2;border-radius:var(--r,14px);transform-style:preserve-3d;box-shadow:0 24px 60px -20px rgba(70,50,25,.45),0 4px 14px -6px rgba(70,50,25,.25);transition:transform 1.2s var(--ease),opacity .9s ease .2s}
  .present .env{transform:translateY(130%);opacity:0;visibility:hidden;box-shadow:none;transition:transform 1.2s var(--ease),opacity .9s ease .2s,visibility 0s linear 1.2s,box-shadow .25s ease}
  .env-back{position:absolute;inset:0;z-index:0;border-radius:var(--r,14px);background:var(--inside);box-shadow:0 24px 60px -20px rgba(70,50,25,.45);transition:transform 1.2s var(--ease),opacity .9s ease .2s,visibility 0s linear 1.2s,box-shadow .25s ease}
  .present .env-back{transform:translateY(130%);opacity:0;visibility:hidden;box-shadow:none}
  .env-back::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 47%,rgba(90,70,40,.10),rgba(90,70,40,.03) 55%,transparent)}

  /* flaps: top+bottom fold first, then left+right. slow-in / slow-out like paper, with light that changes as they turn */
  .flap{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.5,.02,.18,1)}
  .face{position:absolute;inset:0;backface-visibility:hidden}
  .face.front{background-image:var(--env);background-size:100% 100%}
  .face.front::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--dir,180deg),rgba(60,45,25,0),rgba(60,45,25,.18));
    opacity:0;transition:opacity .8s ease}
  .open .face.front::after{opacity:1}
  .face.back{background:var(--inside)}
  .face.back::before{content:"";position:absolute;inset:0;background-image:var(--env);background-size:100% 100%;opacity:.18;filter:grayscale(1)}
  .face.back::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--dir,180deg),rgba(90,70,40,.12),rgba(90,70,40,.02) 65%)}
  .flap.top{z-index:4;transform-origin:50% 0}      .flap.left{z-index:3;transform-origin:0 50%}
  .flap.right{z-index:3;transform-origin:100% 50%} .flap.bottom{z-index:2;transform-origin:50% 100%}
  .flap.top .face{clip-path:polygon(0 0,100% 0,50% 47%);--dir:180deg}     .flap.bottom .face{clip-path:polygon(0 100%,50% 47%,100% 100%);--dir:0deg}
  .flap.left .face{clip-path:polygon(0 0,50% 47%,0 100%);--dir:90deg}     .flap.right .face{clip-path:polygon(100% 0,50% 47%,100% 100%);--dir:270deg}
  .flap.top .face.back,.flap.bottom .face.back{transform:rotateX(180deg)}
  .flap.left .face.back,.flap.right .face.back{transform:rotateY(180deg)}
  .open .flap.top{transform:rotateX(164deg);transition-delay:.3s}
  .open .flap.bottom{transform:rotateX(-164deg);transition-delay:.3s}
  .open .flap.left{transform:rotateY(-164deg);transition-delay:1.2s}
  .open .flap.right{transform:rotateY(164deg);transition-delay:1.2s}
  .open .flap.top .face.front::after,.open .flap.bottom .face.front::after{transition-delay:.3s}
  .open .flap.left .face.front::after,.open .flap.right .face.front::after{transition-delay:1.2s}

  .seal{position:absolute;background-image:var(--env);background-repeat:no-repeat;border-radius:50%;border:0;cursor:pointer;padding:0;z-index:5;transition:opacity .6s ease}
  .seal{animation:sealBreath 2.4s ease-in-out infinite;overflow:hidden}
  .seal::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(120deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 60%);
    background-size:250% 100%;animation:sealGloss 4.8s ease-in-out infinite}
  @keyframes sealBreath{0%,100%{scale:1}50%{scale:1.07}}
  @keyframes sealGloss{0%,55%{background-position:120% 0}75%,100%{background-position:-40% 0}}
  .open .seal,.open .seal::after{animation:none}
  @media (prefers-reduced-motion:reduce){.seal,.seal::after{animation:none}}
  .seal:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
  .open .seal{opacity:0;pointer-events:none}

  /* the card inside the envelope = the ornament photo, whole (854×1280) */
  .card{position:absolute;left:12%;width:76%;top:18.4%;height:63.3%;z-index:1;
    display:flex;align-items:center;justify-content:center;text-align:center;
    background:var(--cardimg) center/100% 100% no-repeat;
    box-shadow:0 10px 30px -12px rgba(70,50,25,.5);
    transform:scale(.6) rotateX(6deg);
    transition:transform 1.4s var(--ease),box-shadow 1.4s ease}
  .present .card{z-index:6;transform:scale(var(--ps,1.3)) rotateX(0deg);box-shadow:0 30px 60px -20px rgba(70,50,25,.35)}
  /* SAFE ZONE: everything lives inside the card's inner panel — never outside it */
  .card-inner{width:100%;height:100%;font-size:var(--card-font,16px);padding:13.5% 20%;display:flex;flex-direction:column;justify-content:center;gap:.18em;align-items:center;overflow:hidden}
  .line{opacity:0;transform:translateY(8px);transition:opacity .9s ease,transform .9s ease}
  .present .line{opacity:1;transform:none}
  .present .line:nth-child(1){transition-delay:1.1s} .present .line:nth-child(2){transition-delay:1.4s}
  .present .line:nth-child(3){transition-delay:1.7s} .present .line:nth-child(4){transition-delay:1.9s}
  .present .line:nth-child(5){transition-delay:2.1s} .present .line:nth-child(6){transition-delay:2.4s}
  .present .line:nth-child(7){transition-delay:2.7s} .present .line:nth-child(8){transition-delay:2.9s}
  .present .line:nth-child(9){transition-delay:3.1s} .present .line:nth-child(10){transition-delay:3.3s}
  .present .line:nth-child(11){transition-delay:3.6s}

  .bismillah.c1{margin:13% 0 0;width:78%;line-height:0}
  .verse.c2{margin-bottom:.2em}
  .logo.c6{margin:auto 0;flex:0 0 auto;width:26%;height:auto;aspect-ratio:600/1100;max-height:none;object-fit:contain}   /* width-driven, ratio locked — Safari-safe */
  .time.c9{margin-bottom:13%}                          /* same distance from the bottom border as c1 from the top */
  .bismillah.c1 img{width:100%;height:auto;display:block}
  .spacer{margin-top:0}
  .verse.c2{width:68%;line-height:0;margin-top:2.5%}
  .verse.c2 img{width:100%;height:auto;display:block}
  .verse .b{color:var(--gold);font-size:.85em}
  .honor.c3{font-family:var(--serif);font-weight:600;font-size:1.05em;line-height:1.6;margin-top:.1em}
  .families.c4{width:100%;display:flex;justify-content:center;gap:5em;font-family:var(--serif);font-weight:700;font-size:.78em;line-height:1.45}
  .families.c4 b{display:block;font-weight:700;font-size:1.25em;line-height:1.3}
  .families span{flex:0 1 auto;text-align:center}
  .invite.c5{font-family:var(--serif);font-weight:600;font-size:.9em;line-height:1.6}
  .logo{display:block;filter:drop-shadow(0 4px 8px rgba(70,50,25,.15))}
  .day.c7{font-size:.86em;font-weight:600;line-height:1.35}
  .dates.c8{display:flex;justify-content:center;gap:.8em;align-items:center;font-weight:600;font-size:.7em;line-height:1.45}
  .dates .sep{width:1px;height:1em;background:var(--gold);opacity:.6}
  .dates small{display:block;font-family:var(--serif);font-size:.5em;color:var(--ink-soft)}
  .time.c9{font-weight:700;font-size:.7em;line-height:1.6}
  .time .blank{display:inline-block;min-width:7ch;border-bottom:1px dotted var(--ink-soft);margin:0 .3ch}
  .venue.c10{font-weight:600;font-size:.64em;line-height:1.6}
  .venue .en{font-style:italic;letter-spacing:.02em;unicode-bidi:isolate}
  .map{display:inline-block;margin-top:.05em;padding:.25em .9em;border:1px solid var(--gold);border-radius:999px;color:var(--ink);text-decoration:none;
    font-family:var(--serif);font-size:.62em;background:rgba(255,255,255,.35)}
  .map:hover{background:rgba(255,255,255,.6)} .map:focus-visible{outline:2px solid var(--gold);outline-offset:3px}




  /* ---- polish: camera, light, breathing ---- */
  .frame{transition:transform 2.2s cubic-bezier(.4,0,.2,1)}
  .frame.present{transform:scale(1)}
  .frame.open:not(.present){transform:scale(1.03)}
  /* the paper floats (text stays fixed on it); uses the separate `translate` property so it never touches the scale */
  .present .card,.page.in{animation:breathe 7s ease-in-out 2s infinite}
  @keyframes breathe{0%,100%{translate:0 0}50%{translate:0 -4px}}
  .flap,.card,.env{will-change:transform}
  @media (prefers-reduced-motion:reduce){.present .card,.page.in{animation:none}.frame{transition:none}}



  .page .line{opacity:1;transform:none;transition:none}
  .page .venue.c10{margin-bottom:.6em}
  .cue{position:absolute;left:0;right:0;bottom:1.6rem;text-align:center;opacity:0;transition:opacity 1s ease 3.6s;pointer-events:none;color:var(--ink-soft)}
  .present .cue{opacity:1}
  .cue small{display:block;font-family:var(--serif);font-weight:700;font-size:.95rem;margin-bottom:.2rem;color:var(--ink)}
  .cue svg{width:22px;height:22px;stroke-width:1.9;animation:nudge 2.2s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  /* =============== PAGES BELOW =============== */
  .pages{display:none;padding:2.5rem 0 3rem;margin:0;width:100%}   /* transparent: the fixed surface behind shows through, no seam */
  body.opened .pages{display:block}
  .page{position:relative;font-size:var(--page-font,16px);margin:0 auto 1.6rem;width:var(--card-w,94vw);max-width:100%;aspect-ratio:600/888;padding:13.5% 20%;text-align:center;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    background:var(--cardimg) center/100% 100% no-repeat;
    box-shadow:0 20px 50px -25px rgba(70,50,25,.5);
    opacity:0;transform:translateY(18px);transition:opacity 1s ease,transform 1s ease}
  .page.in{opacity:1;transform:none}
  .replay{display:block;margin:1.2rem auto 0;padding:.75rem 1.9rem;border:1px solid var(--ink-soft);border-radius:999px;background:transparent;
    color:var(--ink);font-family:var(--serif);font-size:1rem;cursor:pointer}
  .replay:hover{background:rgba(255,255,255,.35)} .replay:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  
  @media (prefers-reduced-motion:reduce){
    .env,.flap,.card,.line,.seal,.page,.cue{transition-duration:.01s!important;transition-delay:0s!important}
    .cue svg{animation:none}
  }
</style>

<script>
(function(){
  const frame=document.getElementById('frame'),seal=document.getElementById('seal'),body=document.body,
        reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CX=.508,CY=.481,D=.40;
  function placeSeal(){
    const W=frame.clientWidth,H=frame.clientHeight,d=D*W,l=CX*W-d/2,tp=CY*H-d/2;
    seal.style.width=d+'px';seal.style.height=d+'px';seal.style.left=l+'px';seal.style.top=tp+'px';
    seal.style.backgroundSize=W+'px '+H+'px';seal.style.backgroundPosition=(-l)+'px '+(-tp)+'px';
  }
  const card=document.querySelector('.card');
  function fitCard(){ // final card size: fill the screen with a margin, whatever the device
    const s=Math.min(innerWidth*0.98/card.offsetWidth, innerHeight*0.96/card.offsetHeight);
    frame.style.setProperty('--ps',s.toFixed(3));
    const finalW=card.offsetWidth*s;
    document.documentElement.style.setProperty('--card-w',finalW.toFixed(1)+'px'); // pages below match page 1
    card.style.setProperty('--card-font',(card.offsetWidth/23).toFixed(2)+'px');   // pre-scale; ends up = finalW/23
    document.documentElement.style.setProperty('--page-font',(finalW/23).toFixed(2)+'px');
  }
  // rounded outer corners on the four flaps (clip-path paths are in px, so rebuild on resize)
  function roundFlaps(){
    const W=frame.clientWidth,H=frame.clientHeight,r=Math.min(W,H)*0.045,ax=W/2,ay=H*0.47;
    document.documentElement.style.setProperty('--r',r+'px');
    const P={
      top:`M ${r} 0 H ${W-r} Q ${W} 0 ${W} ${r} L ${ax} ${ay} L 0 ${r} Q 0 0 ${r} 0 Z`,
      bottom:`M 0 ${H-r} L ${ax} ${ay} L ${W} ${H-r} Q ${W} ${H} ${W-r} ${H} H ${r} Q 0 ${H} 0 ${H-r} Z`,
      left:`M 0 ${r} Q 0 0 ${r} 0 L ${ax} ${ay} L ${r} ${H} Q 0 ${H} 0 ${H-r} Z`,
      right:`M ${W-r} 0 Q ${W} 0 ${W} ${r} V ${H-r} Q ${W} ${H} ${W-r} ${H} L ${ax} ${ay} Z`};
    for(const k in P) frame.querySelectorAll('.flap.'+k+' .face').forEach(f=>f.style.clipPath=`path("${P[k]}")`);
  }
  function layout(){placeSeal();fitCard();roundFlaps();}
  layout();addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,300));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.2});
  document.querySelectorAll('.page').forEach(p=>io.observe(p));
  function openCard(){
    seal.disabled=true;frame.classList.add('open');
    setTimeout(()=>{frame.classList.add('present');document.getElementById('stage').classList.add('present');body.classList.remove('sealed');body.classList.add('opened');},reduce?0:2500);
  }
  function resetCard(){
    window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
    setTimeout(()=>{body.classList.add('sealed');body.classList.remove('opened');frame.classList.remove('present','open');layout();document.getElementById('stage').classList.remove('present');
      document.querySelectorAll('.page').forEach(p=>{p.classList.remove('in');io.observe(p)});seal.disabled=false;},reduce?0:500);
  }
  seal.addEventListener('click',openCard);
  document.getElementById('replay').addEventListener('click',resetCard);
})();
</script>
